name: demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache SciFact archive
        uses: actions/cache@v4
        with:
          path: data/data.tar.gz
          key: scifact-data-v1-11c621288d41
      - name: Install package and test dependencies
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Run offline unit and README drift test suite
        run: pytest -p no:cacheprovider -v
      - name: Verify benchmark CLI fails closed offline without cache and passes synthetic mode
        shell: bash
        run: |
          if python scripts/benchmark_open_datasets.py --offline --data-root /tmp/empty_bench_cache --output /tmp/bad.json; then
            echo "Expected non-zero exit when --offline has no cached data"
            exit 1
          fi
          python scripts/benchmark_open_datasets.py --offline --allow-synthetic --data-root /tmp/empty_bench_cache --output /tmp/syn_bench.json
      - name: Run SciFact demo and verify output matches demo/output.txt
        shell: bash
        run: |
          python demo/why_probe.py > /tmp/why_probe_stdout.txt
          grep -v '^Downloading ' /tmp/why_probe_stdout.txt > /tmp/why_probe_clean.txt
          diff -u demo/output.txt /tmp/why_probe_clean.txt

  lean-4-parity:
    name: Lean 4.36.0 Axiom & Python Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime for differential parity
        run: pip install -r requirements.txt -e .
      - name: Install elan and run Lean 4.36.0 build, axiom check, and 160-case parity
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean && lake build && cd ..
          python scripts/verify_lean_parity.py --clean
