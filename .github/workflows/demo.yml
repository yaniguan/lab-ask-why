name: demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache SciFact archive
        uses: actions/cache@v4
        with:
          path: data/data.tar.gz
          key: scifact-data-v1-11c621288d41
      - name: Install elan and verify Lean 4 proofs
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean && lake build
          rm -rf .lake lake-manifest.json
      - name: Install package and test dependencies
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Run offline unit test suite
        run: pytest -q
      - name: Run SciFact demo and verify output matches demo/output.txt
        shell: bash
        run: |
          python demo/why_probe.py > /tmp/why_probe_stdout.txt
          grep -v '^Downloading ' /tmp/why_probe_stdout.txt > /tmp/why_probe_clean.txt
          diff -u demo/output.txt /tmp/why_probe_clean.txt
