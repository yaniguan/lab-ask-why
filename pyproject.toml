[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-ask-why"
version = "0.2.0"
description = "Epistemic Socratic co-scientist: rationale retrieval, assumption probing, and discriminating test framing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "jsonschema>=4.18,<5.0",
]
frontier = [
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
]

[project.scripts]
lab-ask-why = "lab_ask_why.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
